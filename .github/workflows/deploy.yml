# Builds the site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". Without that, this workflow builds but the
# deploy step has nowhere to publish to.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to majors that run on Node 24. The v4 line of these actions
      # targets Node 20, which GitHub deprecated in September 2025 and now
      # force-runs on 24 while printing a warning on every deploy. The inputs
      # used below are unchanged across the bump.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # v5 calls upload-artifact v7 internally; v3 called v4, which is the
      # third action the deprecation warning names even though this workflow
      # never references it directly.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
