<!doctype html>
<html><head><meta charset="utf-8"><title>LBYEC2B smoke test</title></head>
<body style="font:13px/1.5 ui-monospace,monospace;padding:20px">
<pre id="out">running…</pre>
<script>
/* Behavioural smoke test for the three handouts.

   The repo carries no test runner, and both handouts are stateful enough that
   "it builds" proves very little — the assignment workflow alone has thirty
   steps, five completion panels and a persistence model. This drives the real
   pages in an iframe and asserts on what a reader would actually see.

   It caught two genuine bugs on the way in: a completion panel that mounted at
   opacity 0 and never became visible, and an unreadable code span on the deep
   green ground. Run it with tools/smoke.sh. */

const results = [];
const ok = (n, c, d) => results.push(`${c ? "PASS" : "FAIL"}  ${n}${c ? "" : "  <-- " + d}`);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const frame = document.createElement("iframe");
frame.style.cssText = "width:1100px;height:1400px;border:0";
document.body.appendChild(frame);
const load = (p) => new Promise(r => { frame.onload = () => setTimeout(r, 350); frame.src = p; });
const D = () => frame.contentDocument;
const txt = () => D().body.innerText;
const all = (s) => [...D().querySelectorAll(s)];
const byText = (s, re) => all(s).find(e => re.test(e.textContent));
const opacity = (el) => el ? +D().defaultView.getComputedStyle(el).opacity : -1;

async function assignmentWorkflow() {
  results.push("── assignment workflow ──");
  localStorage.removeItem("lbyec2b-aw");
  await load("/assignment-workflow.html");

  ok("starts on the prerequisites", !D().getElementById("walk"), "walk rendered early");
  ok("publishes minutes, never a step count",
     /about 25 minutes/i.test(txt()) && !/\b30\b/.test(txt()), "a 30 appeared");
  byText("button", /Show me the steps anyway/).click(); await wait(400);
  ok("the soft gate opens Stage 1 without ticking", !!D().getElementById("walk"), "walk missing");

  const SIZES = [7, 7, 6, 6, 4];
  let sawTotal = false, maxDen = 0, rowCounts = new Set();

  for (let stage = 1; stage <= 5; stage++) {
    for (let step = 1; step <= SIZES[stage - 1]; step++) {
      const body = txt();
      if (/\b30\b/.test(body)) sawTotal = true;
      // "of 5" is the stage count and legitimate; anything else is a step
      // denominator and must stay small.
      [...body.matchAll(/of (\d+)/gi)].forEach(m => { if (+m[1] !== 5) maxDen = Math.max(maxDen, +m[1]); });
      rowCounts.add(all(".aw-row").length);

      if (stage === 4 && step === 5) {
        all(".gh-ans")[1].click(); await wait(120);
        ok("the alternative branch explains itself and leaves the affirmative reachable",
           /VS Code's doing, not yours/.test(txt()) &&
           all(".gh-ans")[0].getAttribute("aria-pressed") === "false", "no recovery path");
      }
      all(".gh-ans")[0].click(); await wait(110);
      const n = byText("button", /^Next step$/);
      if (n && !n.disabled) { n.click(); await wait(150); }
    }

    await wait(700);   // let the entrance animation settle before reading opacity
    const dlg = D().querySelector('.aw-done-scrim[role="dialog"]');
    ok(`stage ${stage} completion panel appears`, !!dlg, "no panel");
    ok(`stage ${stage} completion panel is visible, not just present`,
       opacity(D().querySelector(".aw-done")) === 1, `opacity ${opacity(D().querySelector(".aw-done"))}`);
    if (!dlg) return;
    ok(`stage ${stage} panel is a modal dialog`, dlg.getAttribute("aria-modal") === "true", "no aria-modal");

    if (stage < 5) {
      ok(`stage ${stage} panel names the next stage and its cost`,
         /about \d+ minutes/i.test(dlg.innerText), "no minutes for the next stage");
      byText("button", new RegExp(`Begin Stage ${stage + 1}`)).click(); await wait(400);
    } else {
      ok("the final panel shows all five outcomes",
         dlg.querySelectorAll(".aw-done-marks li").length === 5, "not five marks");
      byText("button", /^Close$/).click(); await wait(300);
    }
  }

  ok("no step total is ever rendered", !sawTotal, "the string 30 reached the screen");
  ok("the largest denominator shown is 7", maxDen <= 7, `saw 'of ${maxDen}'`);
  ok("the stage map always shows exactly five rows",
     rowCounts.size === 1 && rowCounts.has(5), `row counts seen: ${[...rowCounts]}`);

  const before = JSON.parse(localStorage.getItem("lbyec2b-aw"));
  await load("/assignment-workflow.html");
  const after = JSON.parse(localStorage.getItem("lbyec2b-aw"));
  ok("progress survives a reload",
     after.stage === before.stage && Object.keys(after.answers).length === 30,
     `stage ${after.stage}, ${Object.keys(after.answers).length} answers`);
  ok("a dismissed completion panel does not return", !D().querySelector(".aw-done-scrim"), "reappeared");
  ok("prerequisites collapse once inside the stages", !!D().querySelector(".aw-prereq-bar"), "still expanded");
  ok("the header exposes a progressbar", !!D().querySelector('[role="progressbar"][aria-valuenow]'), "none");
  ok("sealed stages are disabled, not merely styled",
     all(".aw-row.is-sealed .aw-row-head").every(b => b.disabled), "a sealed row was clickable");

  localStorage.setItem("lbyec2b-aw", JSON.stringify(
    { v:1, os:"win", skipped:true, prereq:{}, answers:{}, stage:1, step:4, acknowledged:[] }));
  await load("/assignment-workflow.html");
  D().querySelector(".aw-warn").click(); await wait(250);
  const m = D().querySelector('[role="dialog"][aria-modal="true"]');
  ok("a branching failure opens a resolution", !!m, "no modal");
  ok("the resolution takes focus on open", D().activeElement === m, "focus not moved");
  D().defaultView.dispatchEvent(new (D().defaultView.KeyboardEvent)("keydown", { key:"Escape", bubbles:true }));
  await wait(200);
  ok("Escape closes the resolution", !D().querySelector('[role="dialog"][aria-modal="true"]'), "still open");

  // Figures must stay subordinate to the instruction: this is the whole point
  // of the sizing, and it is the kind of thing a stylesheet edit quietly undoes.
  localStorage.setItem("lbyec2b-aw", JSON.stringify(
    { v:1, os:"win", skipped:true, prereq:{}, answers:{}, stage:1, step:3, acknowledged:[] }));
  await load("/assignment-workflow.html");
  const shot = D().querySelector(".aw-figure .fig-shot");
  const action = D().querySelector(".aw-action");
  ok("the figure is held well inside the text column",
     shot && shot.getBoundingClientRect().width <= 530,
     `figure is ${shot ? Math.round(shot.getBoundingClientRect().width) : "?"}px wide`);
  ok("the instruction is set larger than the figure's caption",
     parseFloat(D().defaultView.getComputedStyle(D().querySelector(".aw-action-text")).fontSize) >= 18,
     "instruction is not the dominant text");
  ok("the figure sits below the instruction, not above it",
     action.compareDocumentPosition(shot) & Node.DOCUMENT_POSITION_FOLLOWING, "figure precedes the instruction");

  // Clips: play on their own, and keep repeating.
  //
  // What is asserted here is the set of attributes that produce that, not the
  // playing itself. Chrome holds muted autoplay video until it is actually in
  // the viewport and starts it then — which is the behaviour we want, and is
  // why no observer is involved — but every clip on this page sits around two
  // thousand pixels down, and neither scrolling the frame nor enlarging it
  // makes Chrome treat it as visible under a virtual clock. Verified by hand
  // instead: a clip plays when you scroll to it and loops until you leave.
  localStorage.setItem("lbyec2b-aw", JSON.stringify(
    { v:1, os:"win", skipped:true, prereq:{}, answers:{}, stage:2, step:2, acknowledged:[] }));
  await load("/assignment-workflow.html");
  const clip = D().querySelector("video");
  ok("the recording is a video, not a looping gif", !!clip, "no video element");
  ok("it repeats automatically", clip.loop === true, "loop not set");
  ok("it is muted, which is what lets it autoplay at all", clip.muted === true, "not muted");
  ok("it plays inline rather than going fullscreen on a phone", clip.playsInline === true, "playsInline not set");
  ok("it is set to start on its own", clip.autoplay === true, "autoplay attribute missing");
  ok("nothing is left needing a click to start it",
     !D().querySelector(".aw-clip-play"), "a play button is still being rendered");

  localStorage.setItem("lbyec2b-aw", JSON.stringify(
    { v:1, os:"win", skipped:true, prereq:{}, answers:{}, stage:1, step:3, acknowledged:[] }));
  await load("/assignment-workflow.html");
  ok("figures offer to enlarge", !!D().querySelector(".fig-zoom"), "no zoom affordance");
  D().querySelector(".fig-zoom").click(); await wait(250);
  const lb = D().querySelector('.aw-lightbox [role="dialog"][aria-modal="true"]');
  ok("selecting a figure opens it full size", !!lb, "no lightbox");
  ok("the enlarged figure takes focus", D().activeElement === lb, "focus not moved");
  D().defaultView.dispatchEvent(new (D().defaultView.KeyboardEvent)("keydown", { key:"Escape", bubbles:true }));
  await wait(200);
  ok("Escape closes the enlarged figure", !D().querySelector(".aw-lightbox"), "still open");

  frame.style.width = "360px"; await wait(250);
  ok("no horizontal overflow at 360px",
     D().documentElement.scrollWidth <= 361, `scrollWidth ${D().documentElement.scrollWidth}`);
  frame.style.width = "1100px";
}

async function githubAccount() {
  results.push("", "── github account (regression) ──");
  localStorage.removeItem("lbyec2b-gh-guide");
  await load("/github-account.html");
  ok("handout renders", /registering a github account/i.test(txt()), "title missing");
  ok("still counts its own seven steps", /step 1 of 7/i.test(txt()), "step 1 of 7 not shown");
  ok("keeps its original 'Self-check' heading", /self-check/i.test(txt()), "heading changed");
  ok("did not inherit the new page's wording", !/checkpoint/i.test(txt()), "says Checkpoint");
  const ans = all(".gh-ans");
  ok("two answers render", ans.length === 2, `found ${ans.length}`);
  ans[1].click(); await wait(150);
  ok("the alternative answer still persists as 'stuck'",
     JSON.parse(localStorage.getItem("lbyec2b-gh-guide")).answers["1"] === "stuck", "storage value changed");
  all(".gh-ans")[0].click(); await wait(150);
  ok("the affirmative answer still counts",
     JSON.parse(localStorage.getItem("lbyec2b-gh-guide")).answers["1"] === "ok", "not stored as ok");
  D().querySelector(".gh-warn").click(); await wait(250);
  ok("the resolution modal still opens", !!D().querySelector('[role="dialog"][aria-modal="true"]'), "no modal");
  ok("its return button keeps the original wording", !!byText("button", /Return to step \d/), "wording changed");
  ok("figures still render through the re-export shim", all("figure").length > 0, "no figures");
  // Handout 01 was not part of this change and must not have inherited it.
  ok("handout 01's figures are not shrunk or made zoomable",
     !D().querySelector(".fig-zoom") && !D().querySelector(".aw-figure"),
     "the workflow page's figure treatment leaked into handout 01");
}


/* ── File I/O, handout 03 ────────────────────────────────────────────────

   The two things worth driving here that no other handout has are the
   prediction checkpoint and the FileMachine. A PredictCheck deliberately does
   not expose which option is correct anywhere in the DOM, so this walks the
   options the way a student does — one at a time until the box reports itself
   solved — which incidentally proves the contract that matters most: a wrong
   answer must never lock the reader out of the right one. */
async function fileIO() {
  results.push("", "── file i/o ──");
  localStorage.removeItem("lbyec2b-fio");
  await load("/file-io.html");

  ok("opens on the stages, with nothing in front of them",
     !D().getElementById("before") && all(".aw-row").length === 4,
     "a gate is still rendered");
  ok("publishes minutes, never a step count",
     /about \d+ minutes/i.test(txt()) && !/\b22\b/.test(txt()), "a step total appeared");
  ok("the sample files are listed at the foot of the page",
     !!D().getElementById("reference") && all(".fio-ref-prog").length >= 12,
     `found ${all(".fio-ref-prog").length} files`);
  ok("does not offer test.txt, which stage 3 writes",
     !all(".fio-ref-prog code").some(n => /^test\.txt$/.test(n.textContent.trim())),
     "test.txt was offered");

  // Every download must actually resolve; a 404 here is an evening lost.
  const hrefs = all(".fio-ref-prog").map(a => a.getAttribute("href"));
  const codes = await Promise.all(hrefs.map(h =>
    fetch("/" + h.replace(/^\.?\//, "")).then(r => r.status).catch(() => 0)));
  ok("every sample file actually downloads", codes.every(c => c === 200),
     `statuses ${[...new Set(codes)].join(",")}`);

  all(".aw-row-head")[0].click(); await wait(400);
  ok("stage 1 opens on a single selection", !!D().getElementById("walk"), "walk missing");

  // A handout is also a reference. These assert the second half of that, which
  // the first version of this page failed: it taught the topic once and then
  // locked the material away behind the checkpoints.
  ok("the learning outcomes are on the page",
     /learning outcomes/i.test(txt()) && /explain what a file is/i.test(txt()),
     "no outcomes stated");
  ok("the reference is present without starting anything",
     !!D().getElementById("reference"), "no reference section");
  ok("the reference carries both function tables",
     /fprintf/.test(txt()) && /fputs/.test(txt()) && /fputc/.test(txt()) &&
     /fscanf/.test(txt()) && /fgets/.test(txt()) && /fgetc/.test(txt()),
     "a function table is missing");
  ok("the removed sections are actually gone",
     !D().getElementById("exercises") && !D().getElementById("further"),
     "a removed section is still rendered");
  ok("the stream model is taught, not assumed",
     /\bstream\b/i.test(txt()), "the word stream never appears");

  ok("the stage map is visible before starting",
     all(".aw-row").length === 4, `found ${all(".aw-row").length} rows`);
  ok("no stage is locked",
     all(".aw-row-lock").length === 0 &&
     all(".aw-row-head").every(b => !b.disabled),
     `${all(".aw-row-lock").length} padlocks, ${all(".aw-row-head").filter(b=>b.disabled).length} disabled`);

  // The real test of unlocking: jump straight to the last stage from a page
  // where nothing has been answered, the way a student revising would.
  all(".aw-row-head")[3].click(); await wait(400);
  ok("a reader can open the last stage without finishing the others",
     !!D().getElementById("walk") && /Stage 4 of 4/i.test(txt()),
     "could not reach stage 5");
  ok("and reach the delimiter code once there",
     /delimit/i.test(txt()) || /comma/i.test(txt()), "stage 5 content missing");
  all(".aw-row-head")[0].click(); await wait(400);
  ok("and go back to the beginning", /Stage 1 of 4/i.test(txt()), "did not return");


  // Accessibility properties that a build cannot check and that were all
  // genuinely wrong once. Measured on the real page rather than asserted.
  const cs = (el) => D().defaultView.getComputedStyle(el);
  const tall = (el) => el ? Math.round(parseFloat(cs(el).minHeight) || el.getBoundingClientRect().height) : 0;

  ok("step chips have a 44px hit area",
     tall(D().querySelector(".aw-steps li")) >= 44, `${tall(D().querySelector(".aw-steps li"))}px`);
  ok("the step title sits under the stage title, not beside it",
     D().querySelector(".aw-step-title")?.tagName === "H3",
     `step title is ${D().querySelector(".aw-step-title")?.tagName}`);
  ok("the stage map is reachable by heading",
     D().querySelector(".aw-map-inner h2.aw-eyebrow") !== null, "no heading on the stage map");


  // One deliberate wrong prediction, checked properly, before walking the rest.
  let firstPredict = null;
  for (let i = 0; i < 6 && !firstPredict; i++) {
    if (all(".pc-choice").length) { firstPredict = true; break; }
    const n = byText("button", /^Next step$/); if (n && !n.disabled) { n.click(); await wait(200); }
  }
  if (firstPredict) {
    const before = all(".pc-choice").length;
    all(".pc-choice")[0].click(); await wait(200);
    const solved = !!D().querySelector(".pc-box.is-solved");
    ok("a prediction reveals a note either way", !!D().querySelector(".pc-note"), "no note revealed");
    ok("nothing is scored or marked wrong",
       !/\bincorrect\b|\bwrong answer\b|\byour score\b/i.test(txt()), "the page scored the answer");
    ok("every option stays selectable after answering",
       all(".pc-choice").length === before &&
       all(".pc-choice").every(b => !b.disabled), "an option was locked");
    if (!solved) {
      const stored = JSON.parse(localStorage.getItem("lbyec2b-fio")).answers;
      ok("a wrong prediction is stored but does not count",
         Object.values(stored).length > 0 && !Object.values(stored).includes("ok"),
         `stored ${JSON.stringify(stored)}`);
    }
  }

  // Walk the whole handout. Predict steps are solved by trying options in turn.
  // Stage sizes are read off the page rather than hard-coded: steps get added
  // to this handout, and a stale constant here would silently stop walking a
  // stage half way and still report a pass.
  let maxDen = 0, rowCounts = new Set(), unsolved = 0, sawConsumedCue = false, sawCodeCue = false, sawFixGroup = false, exDriven = 0;

  for (let stage = 1; stage <= 4; stage++) {
    const size = all(".aw-row.is-current .aw-stepchip").length;
    ok(`stage ${stage} reports its own size`, size > 0, "no step chips rendered");
    for (let step = 1; step <= size; step++) {
      // Scoped to the step counter itself. Scanning all page text also caught
      // the figures' own frame counters, which are not step denominators.
      all(".aw-step-count, .aw-nav-count").forEach(el => {
        const m = /(\d+) of (\d+)/.exec(el.textContent || "");
        if (m) maxDen = Math.max(maxDen, +m[2]);
      });
      rowCounts.add(all(".aw-row").length);

      // Drive the FileMachine wherever one appears.
      // Drive whatever explorable this step carries, through the shared
      // transport rather than through any figure's own controls.
      const ex = D().querySelector(".ex");
      if (ex) {
        const range = ex.querySelector(".ex-range");
        if (range && Number(range.max) > 0) {
          const before = (ex.querySelector(".ex-status") || {}).textContent || "";
          const setValue = Object.getOwnPropertyDescriptor(
            D().defaultView.HTMLInputElement.prototype, "value").set;
          setValue.call(range, String(range.max));
          range.dispatchEvent(new (D().defaultView.Event)("input", { bubbles: true }));
          await wait(200);
          const after = (ex.querySelector(".ex-status") || {}).textContent || "";
          exDriven++;
          ok(`the figure on stage ${stage} step ${step} responds to its timeline`,
             after !== before && after.length > 0, "status did not change when scrubbed");
        }
      }

      // Stage 1 step 2 anticipates three failures of one operation and lists
      // them under one heading. Assert the list, and that each row opens its
      // own resolution rather than all three opening the first.
      if (!sawFixGroup && D().querySelector(".aw-warn-group")) {
        sawFixGroup = true;
        const rows = all(".aw-warn-group .aw-warn");
        ok("a step can list several anticipated failures",
           rows.length >= 2, `found ${rows.length} difficulty rows`);
        const seen = [];
        for (let r = 0; r < rows.length; r++) {
          all(".aw-warn-group .aw-warn")[r].click(); await wait(220);
          const fixDlg = D().querySelector('[role="dialog"][aria-modal="true"]');
          seen.push(fixDlg ? (fixDlg.getAttribute("aria-label") || "") : "");
          D().defaultView.dispatchEvent(
            new (D().defaultView.KeyboardEvent)("keydown", { key: "Escape", bubbles: true }));
          await wait(220);
        }
        ok("each row opens its own resolution",
           new Set(seen).size === rows.length, `opened ${new Set(seen).size} distinct`);
      }

      if (!sawCodeCue && D().querySelector(".fio-copy")) {
        sawCodeCue = true;
        ok("the copy button meets the 44px touch target",
           tall(D().querySelector(".fio-copy")) >= 44,
           `${tall(D().querySelector(".fio-copy"))}px`);
        ok("code blocks are reachable by keyboard when they scroll",
           all(".fio-code-scroll").every(e => e.tabIndex === 0),
           "a scroll container was not focusable");
      }

      const consumed = D().querySelector(".fm-b.is-consumed");
      if (consumed && !sawConsumedCue) {
        sawConsumedCue = true;
        ok("consumed bytes are not marked by colour alone",
           cs(consumed).textDecorationLine.includes("underline"),
           `text-decoration-line: ${cs(consumed).textDecorationLine}`);
      }

      if (all(".pc-choice").length) {
        const opts = all(".pc-choice").length;
        for (let i = 0; i < opts; i++) {
          all(".pc-choice")[i].click(); await wait(90);
          if (D().querySelector(".pc-box.is-solved")) break;
        }
        if (!D().querySelector(".pc-box.is-solved")) unsolved++;
      } else if (all(".gh-ans").length) {
        all(".gh-ans")[0].click(); await wait(90);
      }

      const n = byText("button", /^Next step$/);
      if (n && !n.disabled) { n.click(); await wait(150); }
    }

    await wait(700);
    const dlg = D().querySelector('.aw-done-scrim[role="dialog"]');
    ok(`stage ${stage} completion panel appears`, !!dlg, "no panel");
    if (!dlg) return;
    ok(`stage ${stage} completion panel is visible, not just present`,
       opacity(D().querySelector(".aw-done")) === 1, `opacity ${opacity(D().querySelector(".aw-done"))}`);

    if (stage < 4) {
      byText("button", new RegExp(`Begin Stage ${stage + 1}`)).click(); await wait(400);
    } else {
      ok("the final panel shows all four outcomes",
         dlg.querySelectorAll(".aw-done-marks li").length === 4, "not four marks");
      ok("the finale names what the reader ends up with",
         /formatted table|reads a data file/i.test(dlg.innerText), "no closing artefact named");
      byText("button", /^Close$/).click(); await wait(300);
    }
  }

  ok("every prediction has a reachable correct answer", unsolved === 0, `${unsolved} never solved`);
  ok("at least five explorable figures were driven", exDriven >= 5, `drove ${exDriven}`);

  ok("the stage map always shows exactly four rows",
     rowCounts.size === 1 && rowCounts.has(4), `row counts seen: ${[...rowCounts]}`);
  // The rule is not a particular number, it is that a reader never sees a big
  // one. Stages grow; "of 6" is fine, "of 24" would mean the stage structure
  // had stopped doing its job. Eight is the same bound handout 01 works to.
  ok("the largest step denominator stays small", maxDen <= 8, `saw 'of ${maxDen}'`);

  const TOTAL_STEPS = Object.values(JSON.parse(localStorage.getItem("lbyec2b-fio")).answers)
    .filter(v => v === "ok").length;
  const before = JSON.parse(localStorage.getItem("lbyec2b-fio"));
  await load("/file-io.html");
  const after = JSON.parse(localStorage.getItem("lbyec2b-fio"));
  ok("progress survives a reload",
     after.stage === before.stage &&
     Object.values(after.answers).filter(v => v === "ok").length === TOTAL_STEPS,
     `stage ${after.stage}, ${Object.values(after.answers).filter(v => v === "ok").length} completed`);
  ok("a dismissed completion panel does not return", !D().querySelector(".aw-done-scrim"), "reappeared");

  // The two handouts must not share storage, or finishing one would unlock the other.
  ok("keeps its progress separate from handout 02",
     localStorage.getItem("lbyec2b-fio") !== localStorage.getItem("lbyec2b-aw"),
     "the two handouts share a record");

  frame.style.width = "360px"; await wait(300);
  ok("no horizontal overflow at 360px",
     D().documentElement.scrollWidth <= 361, `scrollWidth ${D().documentElement.scrollWidth}`);
  frame.style.width = "1100px"; await wait(150);
}

(async () => {
  await assignmentWorkflow();
  await githubAccount();
  await fileIO();
  const pass = results.filter(r => r.startsWith("PASS")).length;
  const fail = results.filter(r => r.startsWith("FAIL")).length;
  document.getElementById("out").textContent =
    results.join("\n") + `\n\n${pass}/${pass + fail} passed` + (fail ? `  (${fail} FAILED)` : "");
  document.title = fail ? "FAIL" : "PASS";
})().catch(e => {
  document.getElementById("out").textContent = "ERROR " + e.message + "\n" + e.stack;
  document.title = "FAIL";
});
</script></body></html>
